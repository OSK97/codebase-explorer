services:
  postgres:
    image: postgres:17
    container_name: ai-codebase-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_codebase_explorer
    ports:
      - "5432:5432"

  redis:
    image: redis:8
    container_name: ai-codebase-redis
    ports:
      - "6379:6379"